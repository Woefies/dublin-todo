<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dublin · Things To Do</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Hanken+Grotesk:wght@700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- Set the theme before first paint so a stored/preferred theme never
         flashes the default (static host, no server to stamp the attribute). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dublin-todo-theme');
          if (t !== 'cyanotype' && t !== 'historic')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'historic' : 'cyanotype';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <header id="brand">
        <button id="theme-toggle" type="button"></button>
        <h1 class="brand-word"><span class="brand-drop">D</span>ublin</h1>
        <p class="brand-sub">things to do · established 988</p>
      </header>
      <input
        id="search-input"
        type="search"
        placeholder="Search places…"
        aria-label="Search points of interest"
        autocomplete="off"
      />
      <ul id="search-results" aria-label="Search results"></ul>
      <div id="filters" role="group" aria-label="Filter by category"></div>
    </div>
    <aside id="detail" role="dialog" aria-label="Point of interest details" hidden>
      <button id="detail-close" type="button" aria-label="Close details">×</button>
      <div id="detail-body"></div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
