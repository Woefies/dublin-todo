<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dublin · Things To Do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <header id="brand">
       
        <h1 class="brand-word"><span class="brand-drop">D</span>ublin</h1>
        <p class="brand-sub">things to do · established 988</p>
      </header>
      <input
        id="search-input"
        type="search"
        placeholder="Search places…"
        aria-label="Search points of interest"
        autocomplete="off"
      />
      <ul id="search-results" aria-label="Search results"></ul>
      <div id="filters" role="group" aria-label="Filter by category"></div>
    </div>
    <aside id="detail" role="dialog" aria-label="Point of interest details" hidden>
      <button id="detail-close" type="button" aria-label="Close details">×</button>
      <div id="detail-body"></div>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
